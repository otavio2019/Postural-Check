services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: postural-check-frontend
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    # Expõe o servidor de desenvolvimento e preserva o hot reload dos arquivos locais.
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: postural-check-backend
    working_dir: /app
    command: sh -c "npx prisma migrate deploy && npm run dev"
    # O código montado em /app permite que o reload do tsx acompanhe o host.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postural_check:postural_check@postgres:5432/postural_check?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postural_check
      POSTGRES_USER: postural_check
      POSTGRES_PASSWORD: postural_check
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: postural-images
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: postural-check-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postural_check
      POSTGRES_USER: postural_check
      POSTGRES_PASSWORD: postural_check
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postural_check -d postural_check"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: postural-check-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  # Volumes nomeados evitam reinstalar dependências e perder dados a cada subida.
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
  minio_data:
