services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: postural-check-frontend
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: postural-check-backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postural_check
      POSTGRES_USER: postural_check
      POSTGRES_PASSWORD: postural_check
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17-alpine
    container_name: postural-check-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postural_check
      POSTGRES_USER: postural_check
      POSTGRES_PASSWORD: postural_check
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2026-09-07T16-13-09Z
    container_name: postural-check-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
